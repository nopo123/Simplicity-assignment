openapi: 3.0.0
paths:
  /v1/announcements:
    get:
      operationId: AnnouncementController_findAll
      summary: Returns one page of announcements together with the total number of
        matches. Sorted by last update descending by default, which is the order
        the announcements table renders. The optional text search matches the
        title and the body, and the optional category filter keeps announcements
        carrying at least one of the given categories — filtered announcements
        still return their full category list.
      description: List announcements
      parameters:
        - name: search
          required: false
          in: query
          description: Case-insensitive text search matched against the title and the
            body. Wildcard characters are treated literally, so a term
            containing % or _ finds those characters. At most 255 characters.
          schema:
            maxLength: 255
            example: water supply
            type: string
        - name: categoryIds
          required: false
          in: query
          description: Keeps only announcements that carry at least one of these
            categories. Accepts a repeated parameter or one comma-separated
            value. Filtered announcements still return their full category list.
          schema:
            minimum: 1
            example:
              - 1
              - 8
            type: array
            items:
              type: number
        - name: sortBy
          required: false
          in: query
          description: Column the list is sorted by. Defaults to LAST_UPDATE, which is the
            order the announcements table renders.
          schema:
            default: LAST_UPDATE
            example: LAST_UPDATE
            enum:
              - LAST_UPDATE
              - PUBLICATION_DATE
              - TITLE
            type: string
        - name: sortOrder
          required: false
          in: query
          description: Sort direction. Defaults to DESC.
          schema:
            default: DESC
            example: DESC
            enum:
              - ASC
              - DESC
            type: string
        - name: page
          required: false
          in: query
          description: One-based page number. Defaults to 1.
          schema:
            minimum: 1
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Page size, from 1 to 100. Defaults to 10.
          schema:
            minimum: 1
            maximum: 100
            default: 10
            example: 10
            type: number
      responses:
        "200":
          description: Announcements have been fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAnnouncementListDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBadRequestDto"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionNotFoundDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionInternalServerErrorDto"
      tags:
        - Announcement
    post:
      operationId: AnnouncementController_create
      summary: Creates an announcement. Title, body, publication date and at least one
        existing category are all required. On success every websocket client
        subscribed to the announcements namespace receives an
        announcementCreated message carrying the new announcement.
      description: Create an announcement
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnouncementDto"
      responses:
        "200":
          description: Announcement has been created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAnnouncementDto"
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAnnouncementDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBadRequestDto"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionNotFoundDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionInternalServerErrorDto"
      tags:
        - Announcement
  /v1/announcements/{id}:
    get:
      operationId: AnnouncementController_findOne
      summary: Gets one announcement by its numeric id, including its categories. This
        is what the edit form loads to prefill its fields.
      description: Get an announcement
      parameters:
        - name: id
          required: true
          in: path
          description: Id of the entity
          schema:
            minimum: 1
            example: 1
            type: number
      responses:
        "200":
          description: Announcement has been fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAnnouncementDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBadRequestDto"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionNotFoundDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionInternalServerErrorDto"
      tags:
        - Announcement
    patch:
      operationId: AnnouncementController_update
      summary: Updates an announcement. Every field is optional and only the supplied
        ones change, but categoryIds replaces the whole category set rather than
        merging into it. Any successful update moves the last-update timestamp
        forward, including one that only changes the categories.
      description: Update an announcement
      parameters:
        - name: id
          required: true
          in: path
          description: Id of the entity
          schema:
            minimum: 1
            example: 1
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnnouncementDto"
      responses:
        "200":
          description: Announcement has been updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAnnouncementDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBadRequestDto"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionNotFoundDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionInternalServerErrorDto"
      tags:
        - Announcement
    delete:
      operationId: AnnouncementController_remove
      summary: Deletes an announcement and its category links. Returns no content.
      description: Delete an announcement
      parameters:
        - name: id
          required: true
          in: path
          description: Id of the entity
          schema:
            minimum: 1
            example: 1
            type: number
      responses:
        "200":
          description: Announcement has been deleted successfully
        "204":
          description: ""
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBadRequestDto"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionNotFoundDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionInternalServerErrorDto"
      tags:
        - Announcement
  /v1/categories:
    get:
      operationId: CategoryController_findAll
      summary: Lists every announcement category. Categories are fixed reference data
        seeded by a migration, so this endpoint is read-only. The order returned
        is the order selectors should render, alphabetical by the English label.
      description: Get all announcement categories
      parameters: []
      responses:
        "200":
          description: Categories have been fetched successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GetCategoryDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBadRequestDto"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionNotFoundDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionInternalServerErrorDto"
      tags:
        - Category
  /v1/health:
    get:
      operationId: HealthController_check
      summary: Reports whether the API process is running and able to reach the
        database. Used by container orchestration and by the frontend to detect
        a cold backend.
      description: Liveness probe
      parameters: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHealthDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBadRequestDto"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionNotFoundDto"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionInternalServerErrorDto"
      tags:
        - Health
info:
  title: Announcements
  description: Announcements API description
  version: "1.0"
  contact: {}
tags:
  - name: announcements
    description: ""
servers: []
components:
  schemas:
    TranslationDto:
      type: object
      properties:
        en:
          type: string
          example: City
          description: English translation
        sk:
          type: string
          example: Mesto
          description: Slovak translation
      required:
        - en
        - sk
    GetCategoryDto:
      type: object
      properties:
        id:
          type: number
          minimum: 1
          description: Id of the entity
          example: 1
        code:
          enum:
            - CITY
            - COMMUNITY_EVENTS
            - CRIME_AND_SAFETY
            - CULTURE
            - DISCOUNTS_AND_BENEFITS
            - EMERGENCIES
            - FOR_SENIORS
            - HEALTH
            - KIDS_AND_FAMILY
          type: string
          example: CITY
          description: Stable machine identifier of the category. Reference data seeded by
            a migration — clients match on this, never on the label.
        labels:
          description: Displayed name of the category per language. The client picks the
            language it renders in and falls back to English.
          allOf:
            - $ref: "#/components/schemas/TranslationDto"
        orderingNumber:
          type: number
          minimum: 1
          example: 1
          description: Position of the category in selectors. Categories are returned in
            this order, which is alphabetical by the English label.
      required:
        - id
        - code
        - labels
        - orderingNumber
    GetAnnouncementDto:
      type: object
      properties:
        id:
          type: number
          minimum: 1
          description: Id of the entity
          example: 1
        title:
          type: string
          maxLength: 255
          example: Water supply interruption in the city centre
          description: Headline of the announcement, at most 255 characters. Matched by
            the text search together with the body.
        body:
          type: string
          maxLength: 5000
          example: Water will be shut off on Main Street between 8:00 and 14:00 while the
            main pipe is replaced.
          description: Full text of the announcement, at most 5000 characters. Matched by
            the text search together with the title.
        publicationDate:
          type: string
          example: 2026-08-28T08:55:00.000Z
          description: Date and time the announcement is published, in ISO 8601. Clients
            that let a user type the date collect it as MM/DD/YYYY HH:mm and
            convert before sending.
        categories:
          description: Categories the announcement belongs to, ordered the same way as the
            category list endpoint. Response-only — send categoryIds on write.
          type: array
          items:
            $ref: "#/components/schemas/GetCategoryDto"
        created:
          type: string
          example: 2026-08-28T08:55:00.000Z
          description: Moment the announcement was created, in ISO 8601. Response-only.
        updated:
          type: string
          example: 2026-08-28T09:12:00.000Z
          description: Moment the announcement was last changed, in ISO 8601.
            Response-only, and the default sort key of the list endpoint.
            Replacing only the categories still moves this forward.
      required:
        - id
        - title
        - body
        - publicationDate
        - categories
        - created
        - updated
    GetAnnouncementListDto:
      type: object
      properties:
        items:
          description: Announcements on the requested page, already sorted
          type: array
          items:
            $ref: "#/components/schemas/GetAnnouncementDto"
        total:
          type: number
          minimum: 0
          example: 42
          description: Number of announcements matching the search and filter, across all
            pages
        page:
          type: number
          minimum: 1
          example: 1
          description: One-based page number this response represents
        limit:
          type: number
          minimum: 1
          example: 10
          description: Page size this response was built with
      required:
        - items
        - total
        - page
        - limit
    ExceptionBadRequestDto:
      type: object
      properties:
        message:
          type: string
          description: Human readable description of what went wrong
        timestamp:
          type: string
          example: 2026-08-28T10:15:30.000Z
          description: Moment the error was produced, in ISO 8601
        statusCode:
          type: number
          example: 400
      required:
        - message
        - timestamp
        - statusCode
    ExceptionNotFoundDto:
      type: object
      properties:
        message:
          type: string
          description: Human readable description of what went wrong
        timestamp:
          type: string
          example: 2026-08-28T10:15:30.000Z
          description: Moment the error was produced, in ISO 8601
        statusCode:
          type: number
          example: 404
      required:
        - message
        - timestamp
        - statusCode
    ExceptionInternalServerErrorDto:
      type: object
      properties:
        message:
          type: string
          description: Human readable description of what went wrong
        timestamp:
          type: string
          example: 2026-08-28T10:15:30.000Z
          description: Moment the error was produced, in ISO 8601
        statusCode:
          type: number
          example: 500
      required:
        - message
        - timestamp
        - statusCode
    CreateAnnouncementDto:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          example: Water supply interruption in the city centre
          description: Headline of the announcement, at most 255 characters. Matched by
            the text search together with the body.
        body:
          type: string
          maxLength: 5000
          example: Water will be shut off on Main Street between 8:00 and 14:00 while the
            main pipe is replaced.
          description: Full text of the announcement, at most 5000 characters. Matched by
            the text search together with the title.
        publicationDate:
          type: string
          example: 2026-08-28T08:55:00.000Z
          description: Date and time the announcement is published, in ISO 8601. Clients
            that let a user type the date collect it as MM/DD/YYYY HH:mm and
            convert before sending.
        categoryIds:
          example: &a1
            - 1
            - 2
          description: Ids of the categories the announcement belongs to. At least one
            category is required and every id must exist. On update the whole
            set is replaced, not merged.
          minItems: 1
          type: array
          items:
            type: number
            minimum: 1
      required:
        - title
        - body
        - publicationDate
        - categoryIds
    UpdateAnnouncementDto:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          example: Water supply interruption in the city centre
          description: Headline of the announcement, at most 255 characters. Matched by
            the text search together with the body.
        body:
          type: string
          maxLength: 5000
          example: Water will be shut off on Main Street between 8:00 and 14:00 while the
            main pipe is replaced.
          description: Full text of the announcement, at most 5000 characters. Matched by
            the text search together with the title.
        publicationDate:
          type: string
          example: 2026-08-28T08:55:00.000Z
          description: Date and time the announcement is published, in ISO 8601. Clients
            that let a user type the date collect it as MM/DD/YYYY HH:mm and
            convert before sending.
        categoryIds:
          example: *a1
          description: Ids of the categories the announcement belongs to. At least one
            category is required and every id must exist. On update the whole
            set is replaced, not merged.
          minItems: 1
          type: array
          items:
            type: number
            minimum: 1
    GetHealthDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          example: ok
          description: Overall service state — ok when the database answers, degraded when
            it does not
        database:
          type: boolean
          example: true
          description: Whether a trivial query against the database succeeded
        timestamp:
          type: string
          example: 2026-08-28T10:15:30.000Z
          description: Moment the probe ran, in ISO 8601
      required:
        - status
        - database
        - timestamp
